description: >-
  University of Wollongong publishes no rate-limit documentation, because it publishes no API. No
  OAI-PMH or IIIF endpoint operated by UOW could be confirmed in the 2026-09-01 pass — the earlier
  claim of an OAI-PMH base at ro.uow.edu.au/do/oai/ was a bepress path that did not survive the
  repository's migration to Figshare, and the host now answers every anonymous request with an AWS
  WAF challenge (HTTP 202). The practical limits a client meets on UOW hosts are access controls,
  not throttles: HTTP 403 on courses.uow.edu.au/api and scholars.uow.edu.au/api, HTTP 202 WAF
  challenge on ro.uow.edu.au, and a TCP timeout on api.uow.edu.au.
notes: >-
  No published limit exists to record. Where a vendor tenancy (Figshare, Symplectic, Ex Libris)
  imposes limits, those are the vendor's and are documented on the vendor's own developer site.
