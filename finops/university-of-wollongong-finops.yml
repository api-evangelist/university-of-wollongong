description: >-
  FinOps profile for University of Wollongong. UOW publishes no API and sells no API access, so
  there is no usage-based billing, no invoiced API cost to allocate, and nothing to optimize on
  the consumer side. FinOps relevance is limited to the institution's own internal cloud and
  vendor-platform spend (AWS, MuleSoft CloudHub, Figshare, Symplectic, Ex Libris), none of which
  is publicly disclosed.
notes: >-
  No public usage-based API billing. UOW publishes no API; the surfaces attributed to it are a free
  unauthenticated SAML metadata document, three registry memberships, and vendor tenancies whose
  commercial terms belong to the vendors.
