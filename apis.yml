x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    UOW publishes no API specification and no developer portal, and every callable interface it
    operates itself is credential-gated. The AWS API Gateway behind the UOW Handbook answers
    every anonymous path with HTTP 403 "Missing Authentication Token"; the Symplectic Discovery
    /api mount on scholars.uow.edu.au answers HTTP 403 "Access denied"; and api.uow.edu.au
    resolves in DNS to a MuleSoft CloudHub endpoint (v4fkkn.aus-s1.cloudhub.io) whose TCP 443
    and 80 both time out from the public internet, so an institution API gateway exists but is
    not publicly reachable. What is public and machine-readable is the SAML 2.0 metadata for
    UOW's own Shibboleth IdP (HTTP 200, application/xml) plus its DataCite, Crossref and ROR
    registry records. Research Online and UOW Scholars are Figshare and Symplectic tenancies and
    their contracts belong to those vendors; ro.uow.edu.au additionally sits behind an AWS WAF
    challenge (HTTP 202) that blocks anonymous probing of any path, including OAI-PMH.
  evidence:
  - url: https://idp.uow.edu.au/idp/shibboleth
    status: 200
  - url: https://md.aaf.edu.au/aaf-metadata.xml
    status: 200
