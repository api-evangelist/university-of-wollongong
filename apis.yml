apis:
  - aid: university-of-wollongong:idp-saml-metadata
    name: UOW Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: federation
    description: >-
      The University of Wollongong's own SAML 2.0 Identity Provider. Its EntityDescriptor is
      served publicly and unauthenticated at https://idp.uow.edu.au/idp/shibboleth (HTTP 200,
      application/xml, 4,358 bytes) with entityID https://idp.uow.edu.au/idp/shibboleth, a
      shibmd:Scope of uow.edu.au, IdP-Signing and IdP-Encryption X.509 key descriptors, HTTP-POST
      and HTTP-Redirect SingleSignOnService bindings, and the requested attributes
      auEduPersonSharedToken, email and displayName. The same entity is present in the
      Australian Access Federation aggregate metadata at md.aaf.edu.au/aaf-metadata.xml (HTTP
      200, 3,188,501 bytes), which is how UOW federates with AAF service providers. The IdP is
      run on AAF's Rapid IdP managed Shibboleth service — the 404 page at idp.uow.edu.au titles
      itself "Rapid IdP Manager" — but the entity, the scope, the signing keys and the
      released attributes are UOW's. This is the strongest institution-operated machine-readable
      surface in the profile.
    humanURL: https://www.uow.edu.au/its/
    baseURL: https://idp.uow.edu.au/idp/shibboleth
    tags: [ Identity Federation, Shibboleth, SAML, SSO, AAF, eduGAIN ]
    properties:
      - type: Documentation
        url: https://aaf.edu.au/subscribers/
      - type: IdentityFederation
        url: https://md.aaf.edu.au/aaf-metadata.xml
  - aid: university-of-wollongong:research-online-figshare
    name: Research Online (Figshare tenancy)
    x-operator: tenant
    description: >-
      Research Online is UOW's open access institutional repository, and since its 2025 platform
      migration it is a Figshare tenancy, not the bepress Digital Commons instance the June 2026
      profile recorded. Evidence is unambiguous: ro.uow.edu.au CNAMEs to proxy-eu-01.figshare.com;
      requests to it are answered by an AWS WAF challenge (HTTP 202, x-amzn-waf-action: challenge)
      whose body sets awsWafCookieDomainList = ['figshare.com']; and the Figshare public API
      returns UOW items with url_public_html on ro.uow.edu.au, group_id 57528 and DOIs under the
      prefix 10.71747, which DataCite lists against repository client uow.figshare. The data,
      the DOI prefix and the branded portal are UOW's; the contract is Figshare's and is not
      saved here. The OAI-PMH endpoint the previous profile claimed at /do/oai/ was a bepress
      path and no OAI response could be confirmed on the current platform — every path on the
      host, including /oai and /do/oai/, returns the same 202 WAF challenge.
    humanURL: https://ro.uow.edu.au/
    tags: [ Research Repository, Open Access, Figshare, DOI, Institutional Repository ]
    properties:
      - type: Documentation
        url: https://uow.libguides.com/elements/research-online
      - type: Vendor
        url: https://knowledge.figshare.com/
  - aid: university-of-wollongong:uow-scholars-symplectic
    name: UOW Scholars (Symplectic Elements / Discovery tenancy)
    x-operator: tenant
    description: >-
      UOW Scholars is the university's public researcher-profile portal, running on Symplectic
      Elements with the Symplectic Discovery front end. scholars.uow.edu.au CNAMEs through
      uow.discovery.symplectic.org to lb.apse.discovery.symplectic.org, confirming the tenancy.
      The portal is a Node/Express application that exposes an /api mount — /api/config answers
      HTTP 403 {"error": "Forbidden", "message": "Access denied"} and unknown routes answer the
      Express 404 "Cannot GET /..." — so there is a real HTTP API behind it, but it is not
      public, not documented and not UOW's contract. Elements is UOW's research-output reporting
      and collection system and pushes claimed outputs to ORCID.
    humanURL: https://scholars.uow.edu.au/
    tags: [ Research Profiles, Symplectic Elements, ORCID, CRIS, Research Information ]
    properties:
      - type: Documentation
        url: https://uow.libguides.com/elements
      - type: Vendor
        url: https://www.symplectic.co.uk/
  - aid: university-of-wollongong:library-primo-alma
    name: UOW Library Discovery (Ex Libris Primo / Alma tenancy)
    x-operator: tenant
    description: >-
      The UOW Library runs on the Ex Libris Alma library services platform with the Primo
      discovery layer, on the institution-specific tenant host uow.primo.exlibrisgroup.com
      (HTTP 200). Primo and Alma expose REST APIs for search, bibliographic and
      resource-management workflows, documented on the Ex Libris Developer Network and gated
      behind an institution API key. UOW publishes no developer documentation of its own for
      these APIs, and the specification belongs to Ex Libris, so no contract is saved here.
    humanURL: https://uow.primo.exlibrisgroup.com/
    tags: [ Library, Discovery, Ex Libris, Primo, Alma, REST ]
    properties:
      - type: Documentation
        url: https://developers.exlibrisgroup.com/primo/apis/
      - type: LibraryCatalog
        url: https://www.uow.edu.au/library/
  - aid: university-of-wollongong:course-handbook-api
    name: UOW Handbook course catalog API (undocumented)
    x-operator: institution
    description: >-
      The UOW Handbook at courses.uow.edu.au is a Next.js application served from CloudFront on
      UOW's own registrable domain and backed by an AWS API Gateway at courses.uow.edu.au/api/.
      Every anonymous request to that gateway — /api/, /api/search, /api/course, /api/subjects,
      /api/publisher/configuration, /api/openapi.json — returns HTTP 403 {"message": "Missing
      Authentication Token"}, the API Gateway signature for an unmatched or unauthorized route,
      so no route, schema or specification could be recovered. The site's own robots.txt and
      sitemap.xml are open (HTTP 200) and the handbook content is fully crawlable as HTML. The
      handbook platform itself is CourseLoop's curriculum product; the gateway, the domain and
      the deployment are UOW's. No contract is saved because none is published.
    humanURL: https://courses.uow.edu.au/
    baseURL: https://courses.uow.edu.au/api/
    tags: [ Course Catalog, Handbook, Registrar, AWS API Gateway, Undocumented ]
    properties:
      - type: Documentation
        url: https://www.uow.edu.au/student/handbook/
      - type: Sitemap
        url: https://courses.uow.edu.au/sitemap.xml
  - aid: university-of-wollongong:datacite-membership
    name: DataCite membership (repository uow.figshare)
    x-operator: registry
    description: >-
      The University of Wollongong is a DataCite consortium organization, symbol UOW, provider id
      uow, created 2024-08-26, holding the DOI prefix 10.71747 and operating the DataCite
