aid: university-of-wollongong
name: University of Wollongong
x-type: university
x-category: Public Research University
description: >-
  The University of Wollongong (UOW) is a public research university in Wollongong, New South
  Wales, Australia, established in 1951 (ROR 00jtmb277, GRID grid.1007.6, ISNI 0000 0004 0486
  528X). UOW operates no public, self-service developer portal and publishes no API
  specification: www.uow.edu.au carries no /api, /apis or /developer page across its 5,092-URL
  sitemap, and there is no llms.txt or .well-known/security.txt. What it does operate that is
  machine-readable is an identity surface, not a data surface — a Shibboleth SAML 2.0 Identity
  Provider at idp.uow.edu.au whose EntityDescriptor is served publicly and is registered in the
  Australian Access Federation aggregate — plus registry memberships in DataCite, Crossref and
  ROR that carry its own DOI prefixes. Its research and library platforms are vendor tenancies:
  Research Online (ro.uow.edu.au) is a Figshare instance, UOW Scholars (scholars.uow.edu.au) is
  a Symplectic Elements/Discovery instance, and library discovery runs on Ex Libris Primo/Alma.
  Two institution-hosted API gateways exist under uow.edu.au — an AWS API Gateway behind the UOW
  Handbook at courses.uow.edu.au/api and a MuleSoft CloudHub endpoint at api.uow.edu.au — but
  neither is publicly documented and neither answers an anonymous request.
