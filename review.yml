  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, operator axis first. Two corrections of record.
      (1) Research Online is NOT bepress Digital Commons: ro.uow.edu.au CNAMEs to
      proxy-eu-01.figshare.com and answers with an AWS WAF challenge whose body sets
      awsWafCookieDomainList = ['figshare.com']; the Figshare public API returns UOW items with
      url_public_html on ro.uow.edu.au, group_id 57528 and DOI prefix 10.71747, which DataCite
      lists against repository client uow.figshare. The surface is re-labelled from an
      institution-hosted OAI-PMH endpoint to a Figshare TENANCY, and the OAI-PMH claim is
      withdrawn as unconfirmable. (2) Three surface classes the June pass missed were found: UOW's
      own Shibboleth SAML 2.0 Identity Provider, publicly readable and in the AAF aggregate;
      UOW Scholars on Symplectic Elements/Discovery; and an AWS API Gateway on UOW's own domain
      behind the UOW Handbook. DataCite, Crossref and ROR registry memberships were confirmed
      against each registry's own API. No contract was saved for any vendor platform, and no
      relationship was deleted to achieve that.
    endpoints:
